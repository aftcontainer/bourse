    background-repeat: repeat, no-repeat, no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid var(--line);
    box-shadow: 0 24px 60px -18px rgba(16,38,73,0.22);
    overflow: hidden;
  }
  .brand-bar { height: 6px; background: linear-gradient(90deg, var(--afg-green) 0 55%, var(--afg-red) 55% 100%); }
  .card-inner { padding: 38px 36px 30px; }

  .logo-wrap { text-align: center; margin-bottom: 24px; }
  .logo-wrap img { width: 200px; height: auto; }

  .card-inner h1 { font-size: 1.35rem; font-weight: 600; text-align: center; margin: 0; }
  .card-inner .subtitle { text-align: center; color: var(--muted); font-size: .92rem; margin: 6px 0 28px; }

  .form-label { font-weight: 500; font-size: .88rem; color: var(--ink); }
  .input-group-text { background: #fff; border-right: 0; color: var(--muted); border-radius: 12px 0 0 12px; }
  .form-control { border-left: 0; border-radius: 0 12px 12px 0; padding: .7rem .9rem; font-size: .95rem; }
  .form-control:focus { border-color: var(--afg-green); box-shadow: none; }
  .input-group:focus-within { box-shadow: 0 0 0 4px rgba(0,166,81,0.12); border-radius: 12px; }
  .input-group:focus-within .input-group-text,
  .input-group:focus-within .form-control { border-color: var(--afg-green); }

  .pw-toggle { border: 1px solid #ced4da; border-left: 0; background: #fff; color: var(--muted); border-radius: 0 12px 12px 0; }
  .pw-toggle:hover { color: var(--afg-green); }
  .pw-field .form-control { border-radius: 0; }

  .form-check-input:checked { background-color: var(--afg-green); border-color: var(--afg-green); }
  .form-check-input:focus { box-shadow: 0 0 0 .2rem rgba(0,166,81,0.18); border-color: var(--afg-green); }
  .form-check-label { font-size: .88rem; color: var(--muted); }

  .link-forgot { color: var(--afg-red); text-decoration: none; font-size: .88rem; font-weight: 500; }
  .link-forgot:hover { text-decoration: underline; }

  .btn-afg {
    background: var(--afg-green); color: #fff; font-weight: 600; padding: .72rem;
    border-radius: 12px; border: none; width: 100%; transition: background .15s, transform .05s;
  }
  .btn-afg:hover { background: var(--afg-green-dark); color: #fff; }
  .btn-afg:active { transform: translateY(1px); }
  .btn-afg:focus-visible { outline: 3px solid rgba(0,166,81,.4); outline-offset: 2px; }

  .card-foot {
    border-top: 1px solid var(--line); padding: 16px 36px; display: flex;
    align-items: center; justify-content: center; gap: 8px; color: var(--muted);
    font-size: .8rem; background: #fafbfc;
  }
  .card-foot i { color: var(--afg-green); }
  .page-copy { margin-top: 18px; text-align: center; color: var(--muted); font-size: .78rem; }

        <h1>Connexion à votre espace</h1>
        <p class="subtitle">Accédez à vos comptes en toute sécurité.</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Identifiant / E-mail</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="email" class="form-control" id="email" placeholder="prenom.nom@afgbank.com" autocomplete="username" required />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <div class="input-group pw-field">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Votre mot de passe" autocomplete="current-password" required />
              <button class="btn pw-toggle" type="button" id="pwToggle" aria-label="Afficher le mot de passe">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Se souvenir de moi</label>
            </div>
            <a href="#" class="link-forgot">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn-afg">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
          </button>
        </form>
      </div>

      <div class="card-foot">
        <i class="bi bi-shield-lock-fill"></i>
        <span>Connexion sécurisée &middot; chiffrement SSL 256 bits</span>
      </div>
    </div>

    <p class="page-copy">&copy; 2026 AFG Bank &middot; Atlantic Group. Tous droits réservés.</p>
  </div>

<script src="{% static 'mainapp/login/assets/js/bootstrap.bundle.min.js' %}"></script>
<script>
  const pw = document.getElementById("password");
  const tog = document.getElementById("pwToggle");
  const icon = tog.querySelector("i");
  tog.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    icon.className = show ? "bi bi-eye-slash" : "bi bi-eye";
    tog.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
  });
  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const btn = e.target.querySelector(".btn-afg");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Connexion...';
    setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 1500);
  });
</script>
</body>
